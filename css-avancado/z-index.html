<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando Z-Index</title>
    <style>
        #container{
            position: relative;
        }
        #caixa1{
            width: 300px;
            height: 300px;
            border: 1px solid green;
            background-color: lightgreen;
            text-align: center;
            font-size: 32px;
            z-index: 0;
        }
        #caixa2{
            width: 300px;
            height: 300px;
            border: 1px solid blue;
            background-color: lightblue;
            text-align: center;
            font-size: 32px;
            z-index: 1;
            top: 150px;
            left: 100px;
        }
        #caixa3{
            width: 300px;
            height: 300px;
            border: 1px solid orangered;
            background-color: lightcoral;
            text-align: center;
            font-size: 32px;
            left: 200px;
            z-index: 2;
        }
        .absoluto{
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="container" class="absoluto">
        <div id="caixa1">
            Caixa 1
        </div>
        <div id="caixa2" class="absoluto">
            Caixa 2
        </div>
        <div id="caixa3" class="absoluto">
            Caixa 3
        </div>
    </div>
</body>
</html>
