<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Vertical e Horizontal</title>
    <style>
        #menuVertical ul{
            list-style-type: none;
            padding: 0px;
            width: 200px;
        }
        #menuVertical li{
            background-color: orange;
        }
        #menuVertical li a{
            display: block;
            padding: 0.5em 1.5em;
            text-decoration: none;
            color: black;
        }
        #menuVertical li a:hover{
            color: white;
            background-color: orangered;
        }
    </style>
</head>
<body>
    <div id="menuVertical">
        <h2>Barra de Navegação Vertical</h2>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">Produtos</a></li>
            <li><a href="">Carrinho</a></li>
            <li><a href="">Contato</a></li>
        </ul>
    </div>
</body>
</html>
