<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Items</title>
    <style>
        .alinhamento{
            width: 200px;
            height: 200px;
            border: 1px solid black;
            margin-bottom: 10px;
            padding: 5px;
            display: flex;
        }
        .alinhamento div{
            border: 1px solid red;
            margin: 5px;
        }
        #flex-start{
            align-items: flex-start;
        }
        #flex-end{
            justify-content: flex-end;
            align-items: flex-end;
        }
        #center{
            justify-content: center;
            align-items: center;
        }
        #stretch{
            align-items: stretch;
        }
        #baseline{
            align-items: baseline;
        }
    </style>
</head>
<body>
    <div id="flex-start" class="alinhamento">
        <div>DIV 1</div>
        <div>DIV 2</div>
        <div>DIV 3</div>
    </div>

    <div id="flex-end" class="alinhamento">
        <div>DIV 1</div>
        <div>DIV 2</div>
        <div>DIV 3</div>
    </div>

    <div id="center" class="alinhamento">
        <div>DIV 1</div>
        <div>DIV 2</div>
        <div>DIV 3</div>
    </div>

    <div id="strecht" class="alinhamento">
        <div>DIV 1</div>
        <div>DIV 2</div>
        <div>DIV 3</div>
    </div>

    <div id="baseline" class="alinhamento">
        <div>DIV 1</div>
        <div>DIV 2</div>
        <div>DIV 3</div>
    </div>
</body>
</html>
