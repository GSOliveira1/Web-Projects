<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Flex</title>
    <style>
        #container{
            display: flex;
            flex-direction: row;
            border: 1px solid black;
        }
        #container div{
            border: 1px solid blue;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div>
            DIV 1
        </div>
        <div>
            DIV 2
        </div>
        <div>
            DIV 3
        </div>
        <div>
            DIV 4
        </div>
    </div>
</body>
</html>
