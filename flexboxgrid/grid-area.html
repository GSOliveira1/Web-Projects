<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area</title>
    <style>
        #container-grid{
            width: 700px;
            display: grid;
            border: 1px solid black;
            grid-template-columns: 200px 200px 200px;
            grid-template-rows: 200px 200px;
            gap: 20px;
            padding: 10px;
            margin-bottom: 30px;
        }
        .item-grid{
            border: 1px solid red;
        }
        #item1{
            grid-area: 1 / 1 / 1 / 3;
        }
        #grid-container{
            width: 400px;
            display: grid;
            grid-template-areas: 
                "area1 area3"
                "area2 area4" 
                "area6 area5"
            ;
            grid-template-columns: 150px 200px;
            grid-template-rows: 50px 100px 150px;
            gap: 10px;
            padding: 10px;
            border: 1px solid black;
        }
        #area1{grid-area: area1;}
        #area2{grid-area: area2;}
        #area3{grid-area: area3;}
        #area4{grid-area: area4;}
        #area5{grid-area: area5;}
        #area6{grid-area: area6;}
    </style>
</head>
<body>
    <h1>Utilizando grid-area:</h1>
    <div id="container-grid">
        <div class="item-grid" id="item1">1</div>
        <div class="item-grid">2</div>
        <div class="item-grid">3</div>
        <div class="item-grid">4</div>
        <div class="item-grid">5</div>
    </div>

    <h1>Utilizando grid-template-area:</h1>
    <div id="grid-container">
        <div class="item-grid" id="area1">item1</div>
        <div class="item-grid" id="area2">item2</div>
        <div class="item-grid" id="area3">item3</div>
        <div class="item-grid" id="area4">item4</div>
        <div class="item-grid" id="area5">item5</div>
        <div class="item-grid" id="area6">item6</div>            
    </div>
</body>
</html>
